<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upload two text files, view a colour-coded diff, and selectively apply individual changes from file 1 into file 2 with live re-diffing.">
  <meta name="category" content="Utilities">
  <title>Merge</title>
  <style>
    /* ── THEME ─────────────────────────────────────────────── */
    :root {
      --bg:     #fafafa;
      --bg2:    #f4f4f5;
      --bg3:    #e4e4e7;
      --border: #d4d4d8;
      --text:   #18181b;
      --text2:  #52525b;
      --text3:  #a1a1aa;
      --accent: #2563eb;

      --del-bg:     #fef2f2;
      --del-bg2:    #fee2e2;
      --del-fg:     #991b1b;
      --del-border: #fca5a5;

      --add-bg:     #f0fdf4;
      --add-bg2:    #dcfce7;
      --add-fg:     #166534;
      --add-border: #86efac;

      --empty-bg: #f4f4f5;
      --mono: 'Cascadia Code', 'Fira Code', ui-monospace, 'Courier New', monospace;
      --r: 0.5rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     #09090b;
        --bg2:    #18181b;
        --bg3:    #27272a;
        --border: #3f3f46;
        --text:   #fafafa;
        --text2:  #a1a1aa;
        --text3:  #71717a;
        --accent: #60a5fa;

        --del-bg:     #2d1515;
        --del-bg2:    #3f1c1c;
        --del-fg:     #fca5a5;
        --del-border: #7f1d1d;

        --add-bg:     #0f2d1a;
        --add-bg2:    #14532d;
        --add-fg:     #86efac;
        --add-border: #166534;

        --empty-bg: #18181b;
      }
    }

    [data-theme="light"] {
      --bg:#fafafa; --bg2:#f4f4f5; --bg3:#e4e4e7; --border:#d4d4d8;
      --text:#18181b; --text2:#52525b; --text3:#a1a1aa; --accent:#2563eb;
      --del-bg:#fef2f2; --del-bg2:#fee2e2; --del-fg:#991b1b; --del-border:#fca5a5;
      --add-bg:#f0fdf4; --add-bg2:#dcfce7; --add-fg:#166534; --add-border:#86efac;
      --empty-bg:#f4f4f5;
    }
    [data-theme="dark"] {
      --bg:#09090b; --bg2:#18181b; --bg3:#27272a; --border:#3f3f46;
      --text:#fafafa; --text2:#a1a1aa; --text3:#71717a; --accent:#60a5fa;
      --del-bg:#2d1515; --del-bg2:#3f1c1c; --del-fg:#fca5a5; --del-border:#7f1d1d;
      --add-bg:#0f2d1a; --add-bg2:#14532d; --add-fg:#86efac; --add-border:#166534;
      --empty-bg:#18181b;
    }

    /* ── RESET ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 1rem;

      @media (min-width: 640px) { padding: 1.5rem 2rem; }
    }

    .container { width: 100%; max-width: 100rem; margin-inline: auto; }

    button { cursor: pointer; border: none; background: none; color: inherit; font: inherit; }

    /* ── HEADER ────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 1rem;

      & h1 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.025em; }
    }

    /* ── BUTTONS ───────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.4rem 0.875rem;
      border-radius: var(--r);
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      transition: background 0.12s;

      &:hover { background: var(--bg3); }
    }

    .btn-icon {
      padding: 0.5rem;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--bg2);
      line-height: 0;

      &:hover { background: var(--bg3); }
      & svg { display: block; width: 1.125rem; height: 1.125rem; }
    }

    .btn-apply {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.2rem 0.45rem;
      font-size: 0.7rem;
      font-weight: 600;
      border-radius: 0.3rem;
      background: var(--add-bg2);
      border: 1px solid var(--add-border);
      color: var(--add-fg);
      white-space: nowrap;
      line-height: 1.2;

      &:hover { filter: brightness(0.88); }
    }

    /* ── FILES PANEL ───────────────────────────────────────── */
    details.files-panel {
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 1.25rem;
      background: var(--bg2);

      & > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        cursor: pointer;
        user-select: none;
        font-size: 0.9375rem;
        font-weight: 600;
        list-style: none;

        &::-webkit-details-marker { display: none; }

        & .chevron {
          width: 1rem; height: 1rem;
          color: var(--text3);
          transition: transform 0.2s;
          flex-shrink: 0;
        }
      }

      &[open] > summary .chevron { transform: rotate(180deg); }

      & .files-body {
        padding: 1rem;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 1rem;

        @media (min-width: 768px) { flex-direction: row; }
      }
    }

    /* ── FILE INPUT ────────────────────────────────────────── */
    .file-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;

      & .file-label {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--r);
      padding: 0.6rem 1rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text3);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;

      &:hover, &.dragover {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 6%, transparent);
      }
    }

    textarea.file-text {
      width: 100%;
      min-height: 8rem;
      resize: vertical;
      padding: 0.625rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8125rem;
      line-height: 1.6;
      tab-size: 2;

      &:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
      }
    }

    /* ── DIFF TOOLBAR ──────────────────────────────────────── */
    .diff-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      gap: 0.75rem;
      flex-wrap: wrap;

      & .diff-stats {
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 1.25rem;
        color: var(--text2);
        flex-wrap: wrap;

        & .stat-del { color: var(--del-fg); font-weight: 600; }
        & .stat-add { color: var(--add-fg); font-weight: 600; }
      }
    }

    /* ── DIFF TABLE ────────────────────────────────────────── */
    .diff-wrap {
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }

    .diff-col-header {
      display: grid;
      grid-template-columns: 1fr 4rem 1fr;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      position: sticky;
      top: 0;
      z-index: 2;

      & > div {
        padding: 0.4rem 0.75rem;

        &:nth-child(2) {
          border-left: 1px solid var(--border);
          border-right: 1px solid var(--border);
          background: var(--bg2);
        }
      }
    }

    .diff-row {
      display: grid;
      grid-template-columns: 1fr 4rem 1fr;

      &:not(:last-child) { border-bottom: 1px solid var(--border); }
    }

    .diff-cell {
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 0.78rem;
      line-height: 1.7;
      padding: 0.05rem 0.625rem;
      white-space: pre;
      min-width: 0;
    }

    .diff-gutter {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0.2rem 0.25rem;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--bg2);
    }

    /* Row colours */
    .row-equal {
      & .diff-cell { color: var(--text2); background: var(--bg); }
    }

    .row-del {
      & .diff-left {
        background: var(--del-bg);
        color: var(--del-fg);
        border-left: 3px solid var(--del-border);
      }
      & .diff-right { background: var(--empty-bg); color: var(--text3); }
    }

    .row-ins {
      & .diff-left { background: var(--empty-bg); color: var(--text3); }
      & .diff-right {
        background: var(--add-bg);
        color: var(--add-fg);
        border-right: 3px solid var(--add-border);
      }
    }

    .row-change {
      & .diff-left {
        background: var(--del-bg);
        color: var(--del-fg);
        border-left: 3px solid var(--del-border);
      }
      & .diff-right {
        background: var(--add-bg);
        color: var(--add-fg);
        border-right: 3px solid var(--add-border);
      }
    }

    /* Collapsed section */
    .row-collapsed {
      cursor: pointer;
      background: var(--bg2);

      &:hover { background: var(--bg3); }

      & .collapsed-cell {
        grid-column: 1 / -1;
        text-align: center;
        font-size: 0.8125rem;
        color: var(--text3);
        padding: 0.35rem;

        &:hover { color: var(--accent); }
      }
    }

    /* ── EMPTY / IDENTICAL ─────────────────────────────────── */
    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--text3);
      font-size: 0.9375rem;
      border: 1px dashed var(--border);
      border-radius: var(--r);
    }

    .identical-state {
      padding: 2rem;
      text-align: center;
      color: var(--add-fg);
      background: var(--add-bg);
      border: 1px solid var(--add-border);
      border-radius: var(--r);
      font-size: 0.9375rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Merge</h1>
      <button class="btn-icon" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
          <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
          <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
          <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>
          <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
        </svg>
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <details class="files-panel" id="files-panel" open>
      <summary>
        <span id="files-summary-label">Files</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </summary>
      <div class="files-body">
        <div class="file-panel">
          <span class="file-label">Main file</span>
          <div class="drop-zone" id="drop1">Drop a file here or click to browse</div>
          <input type="file" id="file-input-1" style="display:none">
          <textarea class="file-text" id="text1" spellcheck="false"
                    placeholder="Paste or drop file 1 content here…"></textarea>
        </div>
        <div class="file-panel">
          <span class="file-label">Changes</span>
          <div class="drop-zone" id="drop2">Drop a file here or click to browse</div>
          <input type="file" id="file-input-2" style="display:none">
          <textarea class="file-text" id="text2" spellcheck="false"
                    placeholder="Paste or drop file 2 content here…"></textarea>
        </div>
      </div>
    </details>

    <div class="diff-toolbar" id="diff-toolbar" style="display:none">
      <div class="diff-stats" id="diff-stats"></div>
      <div style="display:flex;gap:0.5rem">
        <button class="btn btn-download" id="download-btn" title="Download the main file with all applied changes">&#x2193; Download main file</button>
        <button class="btn" id="clear-btn">Clear all</button>
      </div>
    </div>

    <div id="diff-view">
      <div class="empty-state">Upload or paste two files above to see the diff.</div>
    </div>
  </div>

  <script>
    'use strict';

    // ── LCS DIFF ──────────────────────────────────────────────
    // Returns array of {type:'equal'|'delete'|'insert', val:string}
    // 'delete' = in file1 only  |  'insert' = in file2 only
    function lcsDiff(text1, text2) {
      const a = text1.split('\n');
      const b = text2.split('\n');
      const m = a.length, n = b.length;

      if (m * n > 50_000_000) {
        return { error: `Files too large (${m} × ${n} lines). Try files under ~7000 lines each.` };
      }

      // Flat Uint32Array DP table — far faster than array-of-arrays
      const W = n + 1;
      const dp = new Uint32Array((m + 1) * W);
      for (let i = 1; i <= m; i++) {
        const row  = i * W;
        const prev = row - W;
        for (let j = 1; j <= n; j++) {
          if (a[i - 1] === b[j - 1]) dp[row + j] = dp[prev + j - 1] + 1;
          else dp[row + j] = dp[prev + j] > dp[row + j - 1] ? dp[prev + j] : dp[row + j - 1];
        }
      }

      // Backtrack to build ops
      const ops = [];
      let i = m, j = n;
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
          ops.push({ type: 'equal', val: a[i - 1] });
          i--; j--;
        } else if (j > 0 && (i === 0 || dp[i * W + j - 1] >= dp[(i - 1) * W + j])) {
          ops.push({ type: 'insert', val: b[j - 1] });
          j--;
        } else {
          ops.push({ type: 'delete', val: a[i - 1] });
          i--;
        }
      }
      ops.reverse();
      return { ops };
    }

    // ── PROCESS OPS → DISPLAY ROWS + HUNKS ───────────────────
    // displayRows: [{type, left, right, hunkId, isStart}]
    // hunks:       [{id, file1Lines, file2Start, file2Count}]
    function processOps(ops) {
      const displayRows = [];
      const hunks = [];
      let f2Pos = 0;
      let i = 0;

      while (i < ops.length) {
        if (ops[i].type === 'equal') {
          displayRows.push({ type: 'equal', left: ops[i].val, right: ops[i].val });
          f2Pos++;
          i++;
          continue;
        }

        // Gather all consecutive non-equal ops into one hunk
        const hunkId = hunks.length;
        const f2Start = f2Pos;
        const deletes = [], inserts = [];

        while (i < ops.length && ops[i].type !== 'equal') {
          if (ops[i].type === 'delete') {
            deletes.push(ops[i].val);
          } else {
            inserts.push(ops[i].val);
            f2Pos++;
          }
          i++;
        }

        // Pair deletions with insertions for side-by-side rows
        const len = Math.max(deletes.length, inserts.length);
        for (let k = 0; k < len; k++) {
          const hasL = k < deletes.length;
          const hasR = k < inserts.length;
          displayRows.push({
            type: (hasL && hasR) ? 'change' : hasL ? 'del' : 'ins',
            left:  hasL ? deletes[k] : null,
            right: hasR ? inserts[k] : null,
            hunkId,
            isStart: k === 0,
          });
        }

        hunks.push({ id: hunkId, file1Lines: deletes, file2Start: f2Start, file2Count: inserts.length });
      }

      return { displayRows, hunks };
    }

    // ── COLLAPSE LONG EQUAL RUNS ──────────────────────────────
    const CTX = 4; // context lines to show around each hunk

    function collapseEqualRuns(rows) {
      const out = [];
      let i = 0;
      while (i < rows.length) {
        if (rows[i].type !== 'equal') { out.push(rows[i]); i++; continue; }

        let j = i;
        while (j < rows.length && rows[j].type === 'equal') j++;
        const count = j - i;

        if (count <= CTX * 2) {
          for (let k = i; k < j; k++) out.push(rows[k]);
        } else {
          for (let k = i; k < i + CTX; k++) out.push(rows[k]);
          out.push({ type: 'collapsed', count: count - CTX * 2, start: i + CTX, end: j - CTX });
          for (let k = j - CTX; k < j; k++) out.push(rows[k]);
        }
        i = j;
      }
      return out;
    }

    // ── HTML HELPERS ──────────────────────────────────────────
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── RENDER ────────────────────────────────────────────────
    function renderDiff(displayRows, hunks) {
      // Stats
      const f1unique = hunks.reduce((s, h) => s + h.file1Lines.length, 0);
      const f2unique = hunks.reduce((s, h) => s + h.file2Count, 0);
      document.getElementById('diff-stats').innerHTML =
        `<span class="stat-del">&#8722;${f1unique} from file&nbsp;1</span>` +
        `<span class="stat-add">+${f2unique} from file&nbsp;2</span>` +
        `<span>${hunks.length} hunk${hunks.length !== 1 ? 's' : ''}</span>`;
      document.getElementById('diff-toolbar').style.display = 'flex';

      if (hunks.length === 0) {
        return '<div class="identical-state">Files are identical — no differences found.</div>';
      }

      const collapsed = collapseEqualRuns(displayRows);
      const parts = [
        '<div class="diff-wrap">',
        '<div class="diff-col-header">',
        '<div>Main file</div><div></div><div>Changes</div>',
        '</div>',
      ];

      for (const row of collapsed) {
        if (row.type === 'collapsed') {
          parts.push(
            `<div class="diff-row row-collapsed" data-start="${row.start}" data-end="${row.end}">` +
            `<div class="collapsed-cell">&#8597; ${row.count} unchanged line${row.count !== 1 ? 's' : ''} &#8212; click to expand</div>` +
            `</div>`
          );
          continue;
        }

        if (row.type === 'equal') {
          parts.push(
            `<div class="diff-row row-equal">` +
            `<div class="diff-cell diff-left">${esc(row.left)}</div>` +
            `<div class="diff-gutter"></div>` +
            `<div class="diff-cell diff-right">${esc(row.right)}</div>` +
            `</div>`
          );
          continue;
        }

        const cls = row.type === 'change' ? 'row-change' : row.type === 'del' ? 'row-del' : 'row-ins';
        const leftHtml  = row.left  !== null ? esc(row.left)  : '';
        const rightHtml = row.right !== null ? esc(row.right) : '';
        const gutter = row.isStart
          ? `<button class="btn-apply" data-hunk="${row.hunkId}" ` +
            `title="Replace this section in file 2 with the file 1 version">&#x2190; Apply</button>`
          : '';

        parts.push(
          `<div class="diff-row ${cls}">` +
          `<div class="diff-cell diff-left">${leftHtml}</div>` +
          `<div class="diff-gutter">${gutter}</div>` +
          `<div class="diff-cell diff-right">${rightHtml}</div>` +
          `</div>`
        );
      }

      parts.push('</div>');
      return parts.join('');
    }

    // ── STATE ─────────────────────────────────────────────────
    let currentHunks = [];
    let currentDisplayRows = [];

    // ── UPDATE DIFF ───────────────────────────────────────────
    function updateDiff() {
      const t1 = document.getElementById('text1').value;
      const t2 = document.getElementById('text2').value;
      const view = document.getElementById('diff-view');
      const toolbar = document.getElementById('diff-toolbar');

      if (!t1 || !t2) {
        currentHunks = [];
        currentDisplayRows = [];
        view.innerHTML = '<div class="empty-state">Upload or paste two files above to see the diff.</div>';
        toolbar.style.display = 'none';
        // Update summary label
        const label = !t1 && !t2 ? 'Files' : !t1 ? 'Files — file 1 missing' : 'Files — file 2 missing';
        document.getElementById('files-summary-label').textContent = label;
        return;
      }

      const result = lcsDiff(t1, t2);
      if (result.error) {
        view.innerHTML = `<div class="empty-state">${esc(result.error)}</div>`;
        toolbar.style.display = 'none';
        return;
      }

      const { displayRows, hunks } = processOps(result.ops);
      currentHunks = hunks;
      currentDisplayRows = displayRows;

      view.innerHTML = renderDiff(displayRows, hunks);

      // Attach Apply handlers
      view.querySelectorAll('.btn-apply').forEach(btn => {
        btn.addEventListener('click', () => applyHunk(+btn.dataset.hunk));
      });

      // Attach expand handlers
      view.querySelectorAll('.row-collapsed').forEach(row => {
        row.addEventListener('click', () =>
          expandCollapsed(+row.dataset.start, +row.dataset.end, row));
      });

      // Update summary
      const n = hunks.length;
      document.getElementById('files-summary-label').textContent =
        n === 0 ? 'Files — identical' : `Files — ${n} hunk${n !== 1 ? 's' : ''}`;
    }

    // ── APPLY HUNK ────────────────────────────────────────────
    // Replaces the file-2 section of this hunk with the file-1 lines.
    function applyHunk(hunkId) {
      const hunk = currentHunks[hunkId];
      if (!hunk) return;
      const ta = document.getElementById('text2');
      const lines = ta.value.split('\n');
      lines.splice(hunk.file2Start, hunk.file2Count, ...hunk.file1Lines);
      ta.value = lines.join('\n');
      updateDiff();
    }

    // ── EXPAND COLLAPSED ──────────────────────────────────────
    function expandCollapsed(start, end, rowEl) {
      const rows = currentDisplayRows.slice(start, end);
      const html = rows.map(r =>
        `<div class="diff-row row-equal">` +
        `<div class="diff-cell diff-left">${esc(r.left)}</div>` +
        `<div class="diff-gutter"></div>` +
        `<div class="diff-cell diff-right">${esc(r.right)}</div>` +
        `</div>`
      ).join('');
      rowEl.insertAdjacentHTML('afterend', html);
      rowEl.remove();
    }

    // ── FILE UPLOAD ───────────────────────────────────────────
    function setupDrop(dropId, inputId, textareaId) {
      const drop = document.getElementById(dropId);
      const input = document.getElementById(inputId);
      const ta = document.getElementById(textareaId);

      drop.addEventListener('click', () => input.click());
      input.addEventListener('change', () => {
        if (input.files[0]) { readFile(input.files[0], drop, ta); input.value = ''; }
      });
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
      drop.addEventListener('drop', e => {
        e.preventDefault();
        drop.classList.remove('dragover');
        if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0], drop, ta);
      });
    }

    function readFile(file, drop, ta) {
      const reader = new FileReader();
      reader.onload = e => {
        ta.value = e.target.result;
        drop.textContent = file.name;
        updateDiff();
      };
      reader.readAsText(file);
    }

    setupDrop('drop1', 'file-input-1', 'text1');
    setupDrop('drop2', 'file-input-2', 'text2');

    // ── TEXTAREA LIVE DIFF ────────────────────────────────────
    let debounceTimer;
    function scheduleUpdate() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateDiff, 280);
    }
    document.getElementById('text1').addEventListener('input', scheduleUpdate);
    document.getElementById('text2').addEventListener('input', scheduleUpdate);

    // ── CLEAR ─────────────────────────────────────────────────
    document.getElementById('download-btn').addEventListener('click', () => {
      const content = document.getElementById('text2').value;
      if (!content) return;
      const drop1Text = document.getElementById('drop1').textContent.trim();
      const name = (drop1Text === 'Drop a file here or click to browse')
        ? 'merged.txt'
        : drop1Text;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      document.getElementById('text1').value = '';
      document.getElementById('text2').value = '';
      document.getElementById('drop1').textContent = 'Drop a file here or click to browse';
      document.getElementById('drop2').textContent = 'Drop a file here or click to browse';
      document.getElementById('files-panel').open = true;
      updateDiff();
    });

    // ── THEME TOGGLE ──────────────────────────────────────────
    const htmlEl = document.documentElement;
    const sunEl  = document.getElementById('icon-sun');
    const moonEl = document.getElementById('icon-moon');

    function applyTheme(theme) {
      htmlEl.dataset.theme = theme;
      sunEl.style.display  = theme === 'dark'  ? 'block' : 'none';
      moonEl.style.display = theme === 'light' ? 'block' : 'none';
      localStorage.setItem('merge-theme', theme);
    }

    document.getElementById('theme-btn').addEventListener('click', () => {
      applyTheme(htmlEl.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    // Init: prefer saved, else system
    const saved = localStorage.getItem('merge-theme');
    if (saved) {
      applyTheme(saved);
    } else {
      const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      applyTheme(sys);
    }
  </script>
</body>
</html>
