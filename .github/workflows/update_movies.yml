name: Update Movie Schedules

on:
  schedule:
    # 04:17 UTC daily — off the hour to spread runner load
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  update-movies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run movies build script
        working-directory: movies
        run: bash build.sh

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies/scheduled-movies.json movies/doy-movies.json movies/cineworld-movies.json movies/cineworld-events
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update movie schedules"
            git push
          fi
