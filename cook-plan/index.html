<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Schedule and coordinate cooking times for multiple dishes, with appliance conflict detection and a live step-by-step countdown timeline.">
  <meta name="category" content="Productivity">
  <title>Cook Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍🍳</text></svg>">
  <link rel="stylesheet" href="/shared-base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <dialog id="item-dialog" class="dialog" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="dialog-title">Add Food Item</h2>
      <button class="btn-icon dialog-close" id="dialog-close" aria-label="Close">&times;</button>
    </div>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>
  <dialog id="appl-dialog" class="dialog dialog-appl" aria-labelledby="appl-dialog-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="appl-dialog-title">Appliances</h2>
      <button class="btn-icon dialog-close" id="appl-dialog-close" aria-label="Close">&times;</button>
    </div>
    <div class="dialog-body" id="appl-dialog-body"></div>
  </dialog>
  <script type="module" src="main.js"></script>
<script>navigator.serviceWorker?.register("/sw.js")</script>
</body>
</html>
