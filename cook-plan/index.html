<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Schedule and coordinate cooking times for multiple dishes, with appliance conflict detection, a live step-by-step countdown timeline, offline PouchDB storage and live CouchDB sync.">
  <meta name="category" content="Productivity">
  <title>Cook Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍🍳</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <!-- Add / edit a food item -->
  <dialog id="item-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="dialog-title">Add Food Item</h2>
      <button class="btn-icon dialog-close" id="dialog-close" aria-label="Close">&times;</button>
    </div>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>

  <!-- Settings: what's in the kitchen, and where the data syncs to -->
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="settings-title">Settings</h2>
      <button class="btn-icon dialog-close" id="settings-close" aria-label="Close">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="settings-section">
        <h3 class="settings-heading">Kitchen</h3>
        <div id="appliance-settings"></div>
      </div>
      <div class="settings-section">
        <h3 class="settings-heading">Sync</h3>
        <p class="settings-hint">Keep the cook on every device — plan it on a laptop,
          follow the timeline on a phone in the kitchen.</p>
        <sync-settings id="sync-settings"></sync-settings>
      </div>
    </div>
  </dialog>

  <script src="/vendor/pouchdb/pouchdb.min.js"></script>
  <script type="module" src="main.js"></script>
<script>navigator.serviceWorker?.register("/sw.js")</script>
</body>
</html>
