<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Drop a JPEG to inspect every embedded metadata block — EXIF, GPS, XMP, IPTC, ICC profile, JFIF, and the raw JPEG segment map.">
  <meta name="category" content="Developer Tools">
  <title>Image Metadata Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Image Metadata Reader</h1>
    <p class="subtitle">Drop a <code>.jpg</code> to read every embedded metadata block — EXIF, GPS, XMP, IPTC, ICC, JFIF, and the JPEG segment map.</p>

    <section class="upload-zone" id="uploadZone">
      <div class="upload-inner">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          <polyline points="8 12 12 8 16 12"/>
          <line x1="12" y1="8" x2="12" y2="20"/>
        </svg>
        <p>Drop a <strong>.jpg</strong> file here or <label class="file-label" for="fileInput">browse</label></p>
        <p class="hint">Everything is parsed locally in your browser — nothing is uploaded.</p>
      </div>
      <input type="file" id="fileInput" accept="image/jpeg,.jpg,.jpeg" hidden>
    </section>

    <section class="tool-panel" id="toolPanel" hidden>
      <header class="file-info">
        <img id="preview" class="preview" alt="">
        <div class="file-info-text">
          <div class="file-name" id="fileName"></div>
          <div class="file-meta" id="fileMeta"></div>
        </div>
        <button class="btn btn-ghost btn-sm" id="clearBtn" type="button">Change file</button>
      </header>

      <div id="errorBox" class="error-box" hidden></div>

      <div id="sections" class="sections"></div>
    </section>
  </div>

  <script src="parse.js"></script>
  <script src="script.js"></script>
  <script>navigator.serviceWorker?.register("/sw.js")</script>
</body>
</html>
