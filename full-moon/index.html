<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple page that tells you whether it is a full moon today, and when the next full moon is.">
    <meta name="category" content="Productivity">
    <title>Is there a full moon?</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #131a33;
        --text: #e8ecff;
        --text-dim: #9aa3c7;
        --accent: #ffd97a;
        --moon: #f5e9c2;
        --moon-shadow: #c8b88a;
        --crater: #d9c994;
        --radius: 14px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        min-height: 100dvh;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        line-height: 1.5;
        background:
          radial-gradient(ellipse at top, #1c2552 0%, var(--bg) 60%, #05070f 100%);
        background-attachment: fixed;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Star backdrop */
      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
          radial-gradient(1px 1px at 13% 22%, #fff8, transparent 60%),
          radial-gradient(1px 1px at 27% 71%, #ffffffb3, transparent 60%),
          radial-gradient(1.5px 1.5px at 41% 14%, #fff, transparent 60%),
          radial-gradient(1px 1px at 56% 47%, #ffffff99, transparent 60%),
          radial-gradient(1px 1px at 64% 81%, #fffc, transparent 60%),
          radial-gradient(1.5px 1.5px at 73% 31%, #fff, transparent 60%),
          radial-gradient(1px 1px at 81% 60%, #ffffff80, transparent 60%),
          radial-gradient(1px 1px at 89% 12%, #fffd, transparent 60%),
          radial-gradient(1px 1px at 6% 53%, #ffffffaa, transparent 60%),
          radial-gradient(1px 1px at 33% 91%, #fff, transparent 60%),
          radial-gradient(1px 1px at 49% 8%, #ffffff70, transparent 60%),
          radial-gradient(1.5px 1.5px at 95% 75%, #fff, transparent 60%);
      }

      main {
        position: relative;
        z-index: 1;
        flex: 1;
        width: 100%;
        max-width: 760px;
        margin-inline: auto;
        padding: 2rem 1.25rem 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.75rem;
      }

      .moon-wrap {
        width: clamp(180px, 45vw, 280px);
        aspect-ratio: 1;
        position: relative;
        filter: drop-shadow(0 0 40px #ffd97a55) drop-shadow(0 0 14px #ffffff33);
      }

      .moon-wrap.is-no {
        filter: drop-shadow(0 0 18px #6b78b333);
      }

      .moon-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      h1.answer {
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      h1.answer .yes {
        color: var(--accent);
        text-shadow: 0 0 30px #ffd97a55;
      }

      h1.answer .no {
        color: var(--text);
      }

      .question {
        font-size: clamp(1rem, 3vw, 1.25rem);
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-weight: 600;
      }

      .next {
        background: #ffffff0a;
        border: 1px solid #ffffff1a;
        border-radius: var(--radius);
        padding: 1.1rem 1.4rem;
        max-width: 32rem;
        width: 100%;
        backdrop-filter: blur(6px);
      }

      .next-label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-dim);
        margin-bottom: 0.4rem;
      }

      .next-relative {
        font-size: clamp(1.4rem, 4.5vw, 1.9rem);
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      .next-date {
        font-size: 0.9rem;
        color: var(--accent);
        margin-top: 0.3rem;
      }
    </style>
  </head>

  <body>
    <div class="stars" aria-hidden="true"></div>

    <main>
      <div class="moon-wrap" id="moon" aria-hidden="true">
        <svg class="moon-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="moonFill" cx="35%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#fff8e0" />
              <stop offset="55%" stop-color="#f5e9c2" />
              <stop offset="100%" stop-color="#c8b88a" />
            </radialGradient>
            <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
              <stop offset="60%" stop-color="#ffd97a00" />
              <stop offset="100%" stop-color="#ffd97a55" />
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="98" fill="url(#moonGlow)" />
          <circle cx="100" cy="100" r="80" fill="url(#moonFill)" />
          <g fill="#c8b88a" fill-opacity="0.55">
            <circle cx="78" cy="72" r="9" />

          </g>
        </svg>
      </div>

      <p class="question">Is there a full moon?</p>
      <h1 class="answer" id="answer">…</h1>

      <div class="next">
        <div class="next-label">Next full moon</div>
        <div class="next-relative" id="next-relative"></div>
        <div class="next-date" id="next-date">…</div>
      </div>
    </main>

      const MONTHS = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
      const TZ_OFFSET_MIN = { EST: -5 * 60, EDT: -4 * 60 };

      function parseFullMoon(line) {
        // "Sat Jan 03 10:04:15 EST 2026"
        const parts = line.trim().split(/\s+/);
        if (parts.length !== 6) return null;
        const [, mon, day, time, tz, year] = parts;
        const [h, m, s] = time.split(':').map(Number);
        const offsetMin = TZ_OFFSET_MIN[tz];
        if (offsetMin === undefined) return null;
        // Build the UTC timestamp: local time - offset = UTC
        const utcMs = Date.UTC(Number(year), MONTHS[mon], Number(day), h, m, s) - offsetMin * 60 * 1000;
        return new Date(utcMs);
      }

      const moons = FULL_MOONS_RAW.split('\n').map(parseFullMoon).filter(Boolean);

      function isFullMoonNow(now, moons, windowHours = 12) {
        const windowMs = windowHours * 3600 * 1000;
        return moons.some((m) => Math.abs(m.getTime() - now.getTime()) <= windowMs);
      }

      function nextFullMoon(now, moons) {
        return moons.find((m) => m.getTime() > now.getTime()) || null;
      }

      function relativeDays(from, to) {
        // Calendar-day difference in user's local timezone
        const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        const diffMs = startOfDay(to) - startOfDay(from);
        return Math.round(diffMs / (24 * 3600 * 1000));
      }

      function formatRelative(days) {
        if (days === 0) return 'today';
        if (days === 1) return 'tomorrow';
        if (days === -1) return 'yesterday';
        if (days > 0) return `in ${days} days`;
        return `${Math.abs(days)} days ago`;
      }

      function render() {
        const now = new Date();
        const isFull = isFullMoonNow(now, moons);
        const next = nextFullMoon(now, moons);

        const answerEl = document.getElementById('answer');
        const moonEl = document.getElementById('moon');
        if (isFull) {
          answerEl.innerHTML = '<span class="yes">Yes</span>';
          moonEl.classList.remove('is-no');
        } else {
          answerEl.innerHTML = '<span class="no">No</span>';
          moonEl.classList.add('is-no');
        }

        const dateEl = document.getElementById('next-date');
        const relEl = document.getElementById('next-relative');
        if (next) {
          const fmt = new Intl.DateTimeFormat(undefined, {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
          });
          dateEl.textContent = fmt.format(next);
          const days = relativeDays(now, next);
          relEl.textContent = formatRelative(days);
        } else {
          dateEl.textContent = 'No more full moons in the data set.';
          relEl.textContent = '';
        }
      }

      render();
      // Re-render around midnight so the relative day stays fresh
      setInterval(render, 60 * 1000);
