<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fixed Multi-Buzzer</title>
    <style>
        :root {
            --bg-dark: #121212;
            --red: #d63031;
            --blue: #0984e3;
            --green: #00b894;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* The background is the buzzer. It fills 100% of the screen. */
        #buzzer-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--red);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            transition: background-color 0.15s ease;
        }

        /* Top Bar for Mode Selection */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
        }

        .btn {
            padding: 12px 20px;
            border: 2px solid white;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 120px;
            pointer-events: auto; /* Ensures buttons are clickable */
        }

        .btn.active {
            background: white;
            color: black;
        }

        /* Center Content */
        #timer-text {
            font-size: 30vw; /* Responsive font size based on width */
            font-weight: 900;
            color: white;
            line-height: 1;
            pointer-events: none; /* Clicks pass through to background */
        }

        #mode-label {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
            text-transform: uppercase;
            letter-spacing: 4px;
            pointer-events: none;
        }

        /* Bottom Reset Button */
        .bottom-bar {
            position: fixed;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        #reset-btn {
            background: #000;
            border: 1px solid #444;
            padding: 10px 30px;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        #reset-btn:active {
            background: #222;
        }
    </style>
</head>
<body>

    <div id="buzzer-bg">
        <div id="mode-label">15s RESTART</div>
        <div id="timer-text">15</div>
    </div>

    <div class="top-nav">
        <button id="mode15" class="btn active">15s RESTART</button>
        <button id="mode30" class="btn">30s SINGLE</button>
    </div>

    <div class="bottom-bar">
        <button id="reset-btn" class="btn">RESET TIMER</button>
    </div>

    <script>
        let timeLeft = 15;
        let timerInterval = null;
        let currentMode = '15s';

        const bg = document.getElementById('buzzer-bg');
        const timerDisplay = document.getElementById('timer-text');
        const label = document.getElementById('mode-label');
        const btn15 = document.getElementById('mode15');
        const btn30 = document.getElementById('mode30');

        function updateScreen() {
            timerDisplay.innerText = timeLeft;
            if (currentMode === '15s') {
                bg.style.backgroundColor = 'var(--red)';
                label.innerText = "15s RESTART";
            } else {
                bg.style.backgroundColor = 'var(--blue)';
                label.innerText = "30s SINGLE";
            }
        }

        function runTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerDisplay.innerText = "0";
                    bg.style.backgroundColor = 'var(--green)';
                }
            }, 1000);
        }

        // Logic for "Anywhere" click
        window.addEventListener('mousedown', (e) => {
            const id = e.target.id;

            // 1. If hitting a control button, do nothing else
            if (id === 'mode15') {
                currentMode = '15s';
                timeLeft = 15;
                btn15.classList.add('active');
                btn30.classList.remove('active');
                clearInterval(timerInterval);
                timerInterval = null;
                updateScreen();
                return;
            }

            if (id === 'mode30') {
                currentMode = '30s';
                timeLeft = 30;
                btn30.classList.add('active');
                btn15.classList.remove('active');
                clearInterval(timerInterval);
                timerInterval = null;
                updateScreen();
                return;
            }

            if (id === 'reset-btn') {
                timeLeft = (currentMode === '15s') ? 15 : 30;
                clearInterval(timerInterval);
                timerInterval = null;
                updateScreen();
                return;
            }

            // 2. Otherwise, it's a Buzzer Tap
            if (currentMode === '15s') {
                timeLeft = 15;
                updateScreen();
                runTimer();
            } else {
                // 30s Mode: Start only if not already running
                if (!timerInterval && timeLeft > 0) {
                    runTimer();
                }
            }
        });
    </script>
</body>
</html>
