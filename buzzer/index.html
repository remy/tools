
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Mode Buzzer</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --buzzer-color: #e74c3c;
            --secondary-color: #3498db;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Mode Selector Header */
        #controls {
            position: absolute;
            top: 20px;
            z-index: 20;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .mode-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            background: #444;
            color: white;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: var(--secondary-color);
            box-shadow: 0 0 15px var(--secondary-color);
        }

        /* The Main Buzzer */
        #buzzer {
            flex-grow: 1;
            width: 100%;
            background-color: var(--buzzer-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            outline: none;
        }

        #buzzer:active { filter: brightness(0.8); }

        #timer-display {
            font-size: 12rem;
            font-weight: 900;
            color: var(--text-color);
        }

        #status-text {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Small Reset Button */
        #reset-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            cursor: pointer;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="mode15" class="mode-btn active">15s RESTART</button>
        <button id="mode30" class="mode-btn">30s SINGLE</button>
    </div>

    <button id="buzzer">
        <div id="status-text">Tap to Start</div>
        <div id="timer-display">15</div>
    </button>

    <button id="reset-btn">Global Reset</button>

    <script>
        let timeLeft = 15;
        let timerInterval = null;
        let currentMode = '15s'; // '15s' or '30s'
        
        const display = document.getElementById('timer-display');
        const statusText = document.getElementById('status-text');
        const buzzer = document.getElementById('buzzer');
        const resetBtn = document.getElementById('reset-btn');
        const btn15 = document.getElementById('mode15');
        const btn30 = document.getElementById('mode30');

        function setMode(mode) {
            currentMode = mode;
            clearInterval(timerInterval);
            timerInterval = null;
            
            if (mode === '15s') {
                timeLeft = 15;
                btn15.classList.add('active');
                btn30.classList.remove('active');
                statusText.innerText = "Tap to Restart 15s";
            } else {
                timeLeft = 30;
                btn30.classList.add('active');
                btn15.classList.remove('active');
                statusText.innerText = "Tap to Start 30s";
            }
            display.innerText = timeLeft;
            buzzer.style.backgroundColor = "#e74c3c";
        }

        function handleBuzzerClick() {
            if (currentMode === '15s') {
                // Logic: Always resets to 15 on every click
                clearInterval(timerInterval);
                timeLeft = 15;
                display.innerText = timeLeft;
                startCountdown();
            } else {
                // Logic: 30s Single - only starts if not already running
                if (timerInterval === null) {
                    timeLeft = 30;
                    startCountdown();
                }
            }
        }

        function startCountdown() {
            statusText.innerText = "RUNNING...";
            timerInterval = setInterval(() => {
                timeLeft--;
                display.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    display.innerText = "0";
                    statusText.innerText = "FINISHED";
                    buzzer.style.backgroundColor = "#27ae60";
                }
            }, 1000);
        }

        function globalReset(e) {
            e.stopPropagation();
            setMode(currentMode);
        }

        // Listeners
        buzzer.addEventListener('click', handleBuzzerClick);
        resetBtn.addEventListener('click', globalReset);
        btn15.addEventListener('click', () => setMode('15s'));
        btn30.addEventListener('click', () => setMode('30s'));
    </script>
</body>
</html>
