<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Track recurring subscription costs with a monthly calendar view, currency conversion, and export/import support.">
  <meta name="category" content="Productivity">
  <title>Subscription Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-row">
        <div class="month-nav" id="month-nav">
          <button class="nav-btn" id="prev-month" aria-label="Previous month">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h1 class="month-title" id="month-title" role="button" tabindex="0" title="Jump to current month">March 2026</h1>
          <button class="nav-btn" id="next-month" aria-label="Next month">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="header-actions">
          <button class="action-btn" id="btn-search" aria-label="Search (⌘K)" title="Search (⌘K)">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M12 12L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="action-btn" id="btn-year-view" aria-label="Year view" title="Year view">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M2 7H16M6 3V7M12 3V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
          <button class="action-btn" id="btn-quick-add" aria-label="Quick add">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3.75V14.25M3.75 9H14.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="action-btn" id="btn-settings" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 11.25C10.2426 11.25 11.25 10.2426 11.25 9C11.25 7.75736 10.2426 6.75 9 6.75C7.75736 6.75 6.75 7.75736 6.75 9C6.75 10.2426 7.75736 11.25 9 11.25Z" stroke="currentColor" stroke-width="1.5"/><path d="M14.7 11.1C14.5167 11.4917 14.5017 11.9417 14.6583 12.345L14.9583 13.1033C15.1833 13.6683 15.0417 14.31 14.6 14.7517L14.7517 14.6C14.31 15.0417 13.6683 15.1833 13.1033 14.9583L12.345 14.6583C11.9417 14.5017 11.4917 14.5167 11.1 14.7L10.395 15.06C10.0133 15.2533 9.735 15.6033 9.63 16.02L9.435 16.8C9.285 17.3883 8.75333 17.8 8.145 17.8H7.855C7.24667 17.8 6.715 17.3883 6.565 16.8L6.37 16.02C6.265 15.6033 5.98667 15.2533 5.605 15.06L4.9 14.7C4.50833 14.5167 4.05833 14.5017 3.655 14.6583L2.89667 14.9583C2.33167 15.1833 1.69 15.0417 1.24833 14.6L1.4 14.7517C0.958333 14.31 0.816667 13.6683 1.04167 13.1033L1.34167 12.345C1.49833 11.9417 1.48333 11.4917 1.3 11.1L0.94 10.395C0.746667 10.0133 0.396667 9.735 -0.02 9.63L-0.8 9.435C-1.38833 9.285 -1.8 8.75333 -1.8 8.145V7.855" stroke="currentColor" stroke-width="1.2" transform="translate(2 1) scale(0.85)"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="month-chrome" id="month-chrome">
      <div class="filter-bar">
        <div class="toggle-group toggle-filter">
          <input type="radio" name="category-filter" id="filter-all" value="all" checked>
          <label for="filter-all">All</label>
          <input type="radio" name="category-filter" id="filter-personal" value="personal">
          <label for="filter-personal">Personal</label>
          <input type="radio" name="category-filter" id="filter-business" value="business">
          <label for="filter-business">Business</label>
        </div>
      </div>
      <button class="total-bar" id="monthly-total">
        <div class="total-content">
          <span class="total-amount" id="total-amount">£0.00</span>
        </div>
        <span class="total-hint">Tap for breakdown
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5.25 3.5L8.75 7L5.25 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </div>

    <main class="calendar">
      <div class="weekday-header">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </main>

    <div class="year-view is-hidden" id="year-view">
      <div class="year-filter">
        <div class="toggle-group toggle-filter">
          <input type="radio" name="year-category-filter" id="yf-all" value="all" checked>
          <label for="yf-all">All</label>
          <input type="radio" name="year-category-filter" id="yf-personal" value="personal">
          <label for="yf-personal">Personal</label>
          <input type="radio" name="year-category-filter" id="yf-business" value="business">
          <label for="yf-business">Business</label>
        </div>
      </div>
      <div class="year-total" id="year-total"></div>
      <div class="year-grid" id="year-grid"></div>
    </div>
  </div>

  <!-- Add/Edit Subscription -->
  <div id="sub-popover" popover="auto">
    <div class="pop-header">
      <h2 id="sub-popover-title">Add Subscription</h2>
      <button class="pop-close" id="sub-popover-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="sub-form" class="pop-body">
      <label class="field">
        <span class="field-label">Product name</span>
        <input type="text" id="sub-name" required autocomplete="off" placeholder="Netflix, Spotify...">
      </label>
      <label class="field">
        <span class="field-label">URL</span>
        <div class="url-row">
          <img class="favicon-preview" id="favicon-preview" src="" alt="" width="24" height="24" hidden>
          <input type="url" id="sub-url" placeholder="https://example.com" autocomplete="off">
        </div>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">Amount</span>
          <input type="number" id="sub-amount" step="0.01" min="0" required placeholder="9.99">
        </label>
        <label class="field">
          <span class="field-label">Currency</span>
          <select id="sub-currency">
            <option value="GBP">GBP (£)</option>
            <option value="USD">USD ($)</option>
          </select>
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span class="field-label">Billing cycle</span>
          <div class="toggle-group">
            <input type="radio" name="sub-cycle-radio" id="sub-cycle-monthly" value="monthly" checked>
            <label for="sub-cycle-monthly">Monthly</label>
            <input type="radio" name="sub-cycle-radio" id="sub-cycle-yearly" value="yearly">
            <label for="sub-cycle-yearly">Yearly</label>
          </div>
          <select id="sub-cycle" hidden>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </label>
        <div class="field renewal-date-field" id="sub-renewal-field">
          <span class="field-label">Renewal date</span>
          <div class="renewal-row">
            <select id="sub-month" class="renewal-month" hidden>
              <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
              <option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
              <option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option>
              <option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
            </select>
            <input type="number" id="sub-day" min="1" max="31" required placeholder="1">
          </div>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Category</span>
        <div class="toggle-group">
          <input type="radio" name="sub-category-radio" id="sub-cat-personal" value="personal" checked>
          <label for="sub-cat-personal">Personal</label>
          <input type="radio" name="sub-category-radio" id="sub-cat-business" value="business">
          <label for="sub-cat-business">Business</label>
        </div>
      </div>
      <label class="field">
        <span class="field-label">End date <span class="field-hint">— leave empty if still active</span></span>
        <div class="end-date-row">
          <input type="date" id="sub-end-date">
          <button type="button" class="btn btn-ghost btn-sm" id="sub-end-today">Today</button>
          <button type="button" class="btn btn-ghost btn-sm" id="sub-end-clear">Clear</button>
        </div>
      </label>
      <input type="hidden" id="sub-edit-id">
      <div class="pop-actions">
        <button type="button" class="btn btn-danger" id="sub-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <!-- Quick/Mass Add -->
  <div id="quick-add-popover" popover="auto">
    <div class="pop-header">
      <h2>Quick Add</h2>
      <button class="pop-close" id="quick-add-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="quick-add-form" class="pop-body">
      <label class="field">
        <span class="field-label">Product name</span>
        <input type="text" id="qa-name" required autocomplete="off" placeholder="Netflix, Spotify...">
      </label>
      <label class="field">
        <span class="field-label">URL</span>
        <div class="url-row">
          <img class="favicon-preview" id="qa-favicon-preview" src="" alt="" width="24" height="24" hidden>
          <input type="url" id="qa-url" placeholder="https://example.com" autocomplete="off">
        </div>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">Amount</span>
          <input type="number" id="qa-amount" step="0.01" min="0" required placeholder="9.99">
        </label>
        <label class="field">
          <span class="field-label">Currency</span>
          <select id="qa-currency">
            <option value="GBP">GBP (£)</option>
            <option value="USD">USD ($)</option>
          </select>
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span class="field-label">Billing cycle</span>
          <div class="toggle-group">
            <input type="radio" name="qa-cycle-radio" id="qa-cycle-monthly" value="monthly" checked>
            <label for="qa-cycle-monthly">Monthly</label>
            <input type="radio" name="qa-cycle-radio" id="qa-cycle-yearly" value="yearly">
            <label for="qa-cycle-yearly">Yearly</label>
          </div>
          <select id="qa-cycle" hidden>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </label>
        <div class="field renewal-date-field" id="qa-renewal-field">
          <span class="field-label">Renewal date</span>
          <div class="renewal-row">
            <select id="qa-month" class="renewal-month" hidden>
              <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
              <option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
              <option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option>
              <option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
            </select>
            <input type="number" id="qa-day" min="1" max="31" required placeholder="1">
          </div>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Category</span>
        <div class="toggle-group">
          <input type="radio" name="qa-category-radio" id="qa-cat-personal" value="personal" checked>
          <label for="qa-cat-personal">Personal</label>
          <input type="radio" name="qa-category-radio" id="qa-cat-business" value="business">
          <label for="qa-cat-business">Business</label>
        </div>
      </div>
      <div class="pop-actions">
        <button type="button" class="btn btn-ghost" id="qa-save-more">Save &amp; Add More</button>
        <button type="submit" class="btn btn-primary">Save &amp; Close</button>
      </div>
    </form>
  </div>

  <!-- Breakdown -->
  <div id="breakdown-popover" popover="auto">
    <div class="pop-header">
      <h2>Monthly Breakdown</h2>
      <button class="pop-close" id="breakdown-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="pop-body">
      <div class="breakdown-hero" id="breakdown-total">£0.00<span>/mo</span></div>
      <ul class="breakdown-list" id="breakdown-list"></ul>
      <div class="breakdown-empty" id="breakdown-empty" hidden>No subscriptions yet. Tap a day or the + button to add one.</div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings-popover" popover="auto">
    <div class="pop-header">
      <h2>Settings</h2>
      <button class="pop-close" id="settings-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="pop-body">
      <div class="settings-section">
        <h3 class="settings-heading">Display currency</h3>
        <div class="toggle-group toggle-wide">
          <input type="radio" name="display-currency" id="ccy-gbp" value="GBP" checked>
          <label for="ccy-gbp">GBP (£)</label>
          <input type="radio" name="display-currency" id="ccy-usd" value="USD">
          <label for="ccy-usd">USD ($)</label>
        </div>
      </div>
      <label class="field">
        <span class="field-label">Exchange rate (1 USD = ? GBP)</span>
        <input type="number" id="exchange-rate" step="0.001" min="0" value="0.79">
      </label>
      <div class="pop-actions">
        <button class="btn btn-primary" id="settings-save">Save Settings</button>
      </div>
      <div class="settings-section" style="margin-top: 0.5rem">
        <h3 class="settings-heading">Data</h3>
        <div class="data-row">
          <button class="btn btn-ghost" id="btn-export">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 10V13H14V10M8 2V10M8 10L4.5 6.5M8 10L11.5 6.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Export JSON
          </button>
          <label class="btn btn-ghost import-label">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 10V13H14V10M8 2V10M8 10L4.5 6.5M8 10L11.5 6.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 8 8)"/></svg>
            Import JSON
            <input type="file" id="btn-import" accept=".json" hidden>
          </label>
        </div>
      </div>
    </div>
  </div>

  <command-palette></command-palette>

  <script src="command-palette.js"></script>
  <script type="module" src="main.js"></script>
  <script>navigator.serviceWorker?.register("/sw.js")</script>
</body>
</html>
