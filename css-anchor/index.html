<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive playground for CSS Anchor Positioning — drag the anchor, try every position-area, fallback, and visibility combo.">
    <meta name="category" content="Web Demos">
    <title>CSS Anchor Positioning Playground</title>
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-2: #f4f4f5;
        --border: #d4d4d8;
        --text: #18181b;
        --text-dim: #71717a;
        --accent: #4f46e5;
        --accent-dim: #4f46e51a;
        --green: #16a34a;
        --orange: #ea580c;
        --red: #dc2626;
        --radius: 10px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1117;
          --surface: #1a1d27;
          --surface-2: #242736;
          --border: #2e3248;
          --text: #e8e9f0;
          --text-dim: #8b8fa8;
          --accent: #6c63ff;
          --accent-dim: #6c63ff33;
          --green: #22c55e;
          --orange: #f97316;
          --red: #ef4444;
        }
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      [hidden] {
        display: none !important;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        padding: 1rem;
        min-height: 100dvh;
      }

      @media (min-width: 640px) {
        body { padding: 2rem 1rem 4rem; }
      }

      .container {
        width: 100%;
        max-width: 1100px;
        margin-inline: auto;
      }

      .page-header {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      @media (min-width: 640px) {
        .page-header { margin-bottom: 2.5rem; }
      }

      .page-header h1 {
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }

      .page-header h1 span { color: var(--accent); }

      .page-header p {
        color: var(--text-dim);
        font-size: 1rem;
        max-width: 60ch;
        margin-inline: auto;
      }

      .badge {
        display: inline-block;
        background: var(--accent-dim);
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 99px;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.2em 0.75em;
        margin-bottom: 0.75rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      footer {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      footer a {
        color: var(--accent);
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header class="page-header">
        <div class="badge">Web Platform</div>
        <h1>CSS <span>Anchor</span> Playground</h1>
        <p>Drag the anchor inside the scrollable canvas, then change every <code>position-area</code>, <code>position-try-fallbacks</code>, <code>position-visibility</code>, and <code>anchor-size()</code> combo to see how the popup behaves at the edges.</p>
      </header>

      <css-anchor-playground></css-anchor-playground>

      <footer>
        Spec: <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Anchor_positioning" target="_blank" rel="noopener">MDN — Anchor positioning</a>
      </footer>
    </div>

    <script src="css-anchor.wc.js"></script>
  <script>navigator.serviceWorker?.register("/sw.js")</script>
</body>

</html>
