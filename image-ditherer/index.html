<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dither images into braille character art. Upload or paste an image, adjust threshold, contrast and font size, then copy the output.">
  <meta name="category" content="Image Tools">
  <title>Image Ditherer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f5;
      --fg: #222;
      --fg-muted: #666;
      --fg-subtle: #999;
      --border: #ddd;
      --btn-bg: #fff;
      --btn-border: #ccc;
      --btn-hover-bg: #eee;
      --btn-hover-border: #aaa;
      --accent: #07c;
      --accent-bg: #e0f0ff;
      --toast-bg: #e8f5e9;
      --toast-border: #4caf50;
      --toast-fg: #2e7d32;
      --drop-border: #ccc;
      --drag-accent: #07c;
      --preview-bg: #eee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #e0e0e0;
        --fg-muted: #999;
        --fg-subtle: #555;
        --border: #222;
        --btn-bg: #1a1a1a;
        --btn-border: #444;
        --btn-hover-bg: #252525;
        --btn-hover-border: #666;
        --accent: #6cf;
        --accent-bg: rgba(102, 204, 255, 0.05);
        --toast-bg: #1a3a1a;
        --toast-border: #2a6a2a;
        --toast-fg: #8f8;
        --drop-border: #333;
        --drag-accent: #6cf;
        --preview-bg: #111;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; white-space: nowrap; }
    .controls {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      flex-wrap: wrap;
      flex: 1;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .control-group label {
      font-size: 0.75rem;
      color: var(--fg-muted);
      white-space: nowrap;
    }
    .control-group input[type="range"] {
      width: 100px;
      accent-color: var(--accent);
    }
    .control-group .value {
      font-size: 0.7rem;
      color: var(--accent);
      min-width: 3ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .btn {
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--fg);
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .actions {
      display: flex;
      gap: 0.4rem;
      margin-left: auto;
    }

    .main-area {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Drop zone — shown before image loaded */
    .drop-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      border: 2px dashed var(--drop-border);
      border-radius: 12px;
      margin: 1rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .drop-zone.drag-over {
      border-color: var(--drag-accent);
      background: var(--accent-bg);
    }
    .drop-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--fg-muted);
      user-select: none;
    }
    .drop-hint p { font-size: 1.1rem; margin-bottom: 0.3rem; }
    .drop-hint small { font-size: 0.8rem; color: var(--fg-subtle); }

    /* Split view — shown after image loaded */
    .split-view {
      flex: 1;
      display: none;
      min-height: 0;
    }
    .split-view.active { display: flex; }

    .braille-pane {
      flex: 1;
      overflow: auto;
      min-width: 0;
    }
    #brailleOutput {
      white-space: pre;
      line-height: 1;
      letter-spacing: 0;
      padding: 1rem;
      font-family: monospace;
      user-select: all;
    }

    .preview-pane {
      width: 280px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--preview-bg);
      padding: 1rem;
      gap: 0.75rem;
      overflow: auto;
    }
    .preview-pane canvas {
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      border-radius: 4px;
    }
    .preview-pane .preview-label {
      font-size: 0.7rem;
      color: var(--fg-subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #fileInput { display: none; }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      background: var(--toast-bg);
      border: 1px solid var(--toast-border);
      color: var(--toast-fg);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    @media (max-width: 700px) {
      header { flex-direction: column; align-items: flex-start; }
      .controls { width: 100%; }
      .actions { margin-left: 0; width: 100%; }
      .actions .btn { flex: 1; text-align: center; }
      .split-view.active { flex-direction: column-reverse; }
      .preview-pane {
        width: 100%;
        border-left: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        padding: 0.5rem;
      }
      .preview-pane canvas { max-height: 120px; width: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Image Ditherer</h1>
    <div class="controls">
      <div class="control-group">
        <label for="thresholdSlider">Threshold</label>
        <input type="range" id="thresholdSlider" min="0" max="255" value="128">
        <span class="value" id="thresholdValue">128</span>
      </div>
      <div class="control-group">
        <label for="contrastSlider">Contrast</label>
        <input type="range" id="contrastSlider" min="-100" max="100" value="0">
        <span class="value" id="contrastValue">0</span>
      </div>
      <div class="control-group">
        <label for="fontSlider">Size</label>
        <input type="range" id="fontSlider" min="2" max="16" value="8" step="0.5">
        <span class="value" id="fontValue">8px</span>
      </div>
      <div class="control-group">
        <label for="widthSlider">Width</label>
        <input type="range" id="widthSlider" min="20" max="300" value="100">
        <span class="value" id="widthValue">100</span>
      </div>
      <div class="control-group">
        <label>
          <input type="checkbox" id="invertCheck"> Invert
        </label>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="copyBtn" disabled>Copy</button>
      <button class="btn" id="resetBtn" disabled>Reset</button>
    </div>
  </header>

  <div class="main-area" id="mainArea">
    <div class="drop-zone" id="dropZone">
      <div class="drop-hint">
        <p>Drop or paste an image here</p>
        <small>or click to browse</small>
      </div>
    </div>

    <div class="split-view" id="splitView">
      <div class="braille-pane">
        <div id="brailleOutput"></div>
      </div>
      <div class="preview-pane">
        <span class="preview-label">Dithered</span>
        <canvas id="ditherPreview"></canvas>
        <span class="preview-label">Original</span>
        <canvas id="sourcePreview"></canvas>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*">
  <div class="toast" id="toast">Copied to clipboard</div>
  <canvas id="workCanvas" hidden></canvas>

  <script>
    const $ = (s) => document.querySelector(s);

    const dropZone = $('#dropZone');
    const splitView = $('#splitView');
    const brailleOutput = $('#brailleOutput');
    const fileInput = $('#fileInput');
    const workCanvas = $('#workCanvas');
    const ctx = workCanvas.getContext('2d', { willReadFrequently: true });
    const ditherPreview = $('#ditherPreview');
    const sourcePreview = $('#sourcePreview');

    const thresholdSlider = $('#thresholdSlider');
    const contrastSlider = $('#contrastSlider');
    const fontSlider = $('#fontSlider');
    const widthSlider = $('#widthSlider');
    const invertCheck = $('#invertCheck');
    const copyBtn = $('#copyBtn');
    const resetBtn = $('#resetBtn');

    let sourceImage = null;

    // Braille Unicode block: U+2800 to U+28FF
    // Each braille char is a 2x4 dot grid. Dot numbering:
    //  0  3
    //  1  4
    //  2  5
    //  6  7
    const BRAILLE_BASE = 0x2800;
    const DOT_OFFSETS = [
      [0, 0], [0, 1], [0, 2],
      [1, 0], [1, 1], [1, 2],
      [0, 3], [1, 3],
    ];

    function applyContrast(value, contrast) {
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      return Math.max(0, Math.min(255, factor * (value - 128) + 128));
    }

    function imageToGreyscale(imageData, contrast) {
      const data = imageData.data;
      const grey = new Float32Array(imageData.width * imageData.height);
      for (let i = 0; i < grey.length; i++) {
        const r = data[i * 4];
        const g = data[i * 4 + 1];
        const b = data[i * 4 + 2];
        const a = data[i * 4 + 3] / 255;
        let lum = 0.299 * r + 0.587 * g + 0.114 * b;
        lum = lum * a + 255 * (1 - a);
        grey[i] = applyContrast(lum, contrast);
      }
      return grey;
    }

    function floydSteinbergDither(grey, w, h, threshold, invert) {
      // Work on a copy so we can diffuse error
      const buf = new Float32Array(grey);
      const out = new Uint8Array(w * h);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          const old = buf[i];
          const val = old < threshold ? 0 : 255;
          out[i] = invert ? (val === 0 ? 255 : 0) : val;
          const err = old - val;

          if (x + 1 < w)             buf[i + 1]     += err * 7 / 16;
          if (y + 1 < h && x > 0)    buf[(y+1)*w + x-1] += err * 3 / 16;
          if (y + 1 < h)             buf[(y+1)*w + x]   += err * 5 / 16;
          if (y + 1 < h && x + 1 < w) buf[(y+1)*w + x+1] += err * 1 / 16;
        }
      }
      return out;
    }

    function ditheredToBraille(dithered, imgW, imgH, charW) {
      const charH = Math.ceil(imgH / 4);
      const lines = [];
      for (let cy = 0; cy < charH; cy++) {
        let line = '';
        for (let cx = 0; cx < charW; cx++) {
          let code = 0;
          for (let bit = 0; bit < 8; bit++) {
            const [dx, dy] = DOT_OFFSETS[bit];
            const px = cx * 2 + dx;
            const py = cy * 4 + dy;
            if (px < imgW && py < imgH) {
              if (dithered[py * imgW + px] === 0) code |= (1 << bit);
            }
          }
          line += String.fromCharCode(BRAILLE_BASE + code);
        }
        lines.push(line);
      }
      return lines;
    }

    function cropBraille(lines) {
      const EMPTY = '\u2800';
      let top = 0;
      while (top < lines.length && [...lines[top]].every(c => c === EMPTY)) top++;
      let bottom = lines.length - 1;
      while (bottom > top && [...lines[bottom]].every(c => c === EMPTY)) bottom--;
      lines = lines.slice(top, bottom + 1);
      if (lines.length === 0) return '';

      let left = Infinity;
      let right = 0;
      for (const line of lines) {
        const chars = [...line];
        for (let i = 0; i < chars.length; i++) {
          if (chars[i] !== EMPTY) {
            left = Math.min(left, i);
            right = Math.max(right, i);
          }
        }
      }
      if (left > right) return '';
      return lines.map(line => [...line].slice(left, right + 1).join('')).join('\n');
    }

    function renderDitherPreview(dithered, w, h) {
      ditherPreview.width = w;
      ditherPreview.height = h;
      const pCtx = ditherPreview.getContext('2d');
      const img = pCtx.createImageData(w, h);
      for (let i = 0; i < w * h; i++) {
        const v = dithered[i];
        img.data[i * 4] = v;
        img.data[i * 4 + 1] = v;
        img.data[i * 4 + 2] = v;
        img.data[i * 4 + 3] = 255;
      }
      pCtx.putImageData(img, 0, 0);
    }

    function renderSourcePreview() {
      const maxW = 260;
      const scale = Math.min(1, maxW / sourceImage.width);
      const w = Math.round(sourceImage.width * scale);
      const h = Math.round(sourceImage.height * scale);
      sourcePreview.width = w;
      sourcePreview.height = h;
      sourcePreview.getContext('2d').drawImage(sourceImage, 0, 0, w, h);
    }

    function render() {
      if (!sourceImage) return;

      const charW = parseInt(widthSlider.value);
      const pixelW = charW * 2;
      const pixelH = Math.round((sourceImage.height / sourceImage.width) * pixelW);

      workCanvas.width = pixelW;
      workCanvas.height = pixelH;
      ctx.clearRect(0, 0, pixelW, pixelH);
      ctx.drawImage(sourceImage, 0, 0, pixelW, pixelH);

      const imageData = ctx.getImageData(0, 0, pixelW, pixelH);
      const contrast = parseInt(contrastSlider.value);
      const threshold = parseInt(thresholdSlider.value);
      const invert = invertCheck.checked;

      const grey = imageToGreyscale(imageData, contrast);
      const dithered = floydSteinbergDither(grey, pixelW, pixelH, threshold, invert);

      const lines = ditheredToBraille(dithered, pixelW, pixelH, charW);
      const braille = cropBraille(lines);

      brailleOutput.textContent = braille;
      brailleOutput.style.fontSize = fontSlider.value + 'px';

      renderDitherPreview(dithered, pixelW, pixelH);

      dropZone.style.display = 'none';
      splitView.classList.add('active');
      copyBtn.disabled = false;
      resetBtn.disabled = false;
    }

    function loadImage(source) {
      const img = new Image();
      const onLoad = () => {
        sourceImage = img;
        renderSourcePreview();
        render();
      };
      if (typeof source === 'string') {
        img.onload = onLoad;
        img.src = source;
      } else {
        const url = URL.createObjectURL(source);
        img.onload = () => {
          URL.revokeObjectURL(url);
          onLoad();
        };
        img.src = url;
      }
    }

    function handleFile(file) {
      if (file && file.type.startsWith('image/')) loadImage(file);
    }

    function reset() {
      sourceImage = null;
      brailleOutput.textContent = '';
      splitView.classList.remove('active');
      dropZone.style.display = '';
      copyBtn.disabled = true;
      resetBtn.disabled = true;
    }

    function showToast(msg) {
      const toast = $('#toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    // Event listeners
    thresholdSlider.addEventListener('input', () => {
      $('#thresholdValue').textContent = thresholdSlider.value;
      render();
    });
    contrastSlider.addEventListener('input', () => {
      $('#contrastValue').textContent = contrastSlider.value;
      render();
    });
    fontSlider.addEventListener('input', () => {
      $('#fontValue').textContent = fontSlider.value + 'px';
      if (brailleOutput.textContent) {
        brailleOutput.style.fontSize = fontSlider.value + 'px';
      }
    });
    widthSlider.addEventListener('input', () => {
      $('#widthValue').textContent = widthSlider.value;
      render();
    });
    invertCheck.addEventListener('change', render);

    copyBtn.addEventListener('click', async () => {
      if (!brailleOutput.textContent) return;
      try {
        await navigator.clipboard.writeText(brailleOutput.textContent);
        showToast('Copied to clipboard');
      } catch {
        const range = document.createRange();
        range.selectNodeContents(brailleOutput);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        showToast('Copied to clipboard');
      }
    });

    resetBtn.addEventListener('click', reset);

    // Drop zone
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => {
      handleFile(fileInput.files[0]);
      fileInput.value = '';
    });

    // Paste from clipboard
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          handleFile(item.getAsFile());
          return;
        }
      }
    });
  </script>
  <script>navigator.serviceWorker?.register("/sw.js")</script>
</body>
</html>
