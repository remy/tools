<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Deduplicate photos in Immich. Compare duplicate pairs side-by-side, choose which to keep, and trash the rest. Album memberships are merged to the kept asset before trashing.">
    <title>Immich Dedupe</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="container">
      <div class="sidebar">
        <h1>Immich Dedupe</h1>

        <div class="form-group">
          <label for="host">Immich Host</label>
          <input type="text" id="host" placeholder="http://localhost:3001" />
        </div>

        <div class="form-group">
          <label for="apiKey">API Key</label>
          <input type="password" id="apiKey" placeholder="Your API key" />
        </div>

        <div class="form-group use-proxy">
          <label for="useProxy">Use Proxy</label>
          <input type="checkbox" id="useProxy" />
        </div>

        <div class="form-group" id="proxyGroup" style="display: none;">
          <label for="proxy">Proxy URL</label>
          <input type="text" id="proxy" placeholder="http://localhost:3000" />
        </div>

        <div class="form-group use-proxy">
          <label for="dryRun">Dry Run</label>
          <input type="checkbox" id="dryRun" checked />
        </div>

        <button id="loadBtn" class="btn-primary">Load Duplicates</button>

        <div class="controls">
          <div class="control-info">
            <strong>Keyboard Shortcuts:</strong>
            <div class="shortcut">T - Trash selected &amp; next</div>
            <div class="shortcut">S - Skip (next pair)</div>
            <div class="shortcut">&#8592; / &#8594; - Prev / Next pair</div>
            <div class="shortcut">1 / 2 - Toggle keep on asset</div>
          </div>
          <button id="toggleSidebarBtn" class="btn-secondary" style="width: 100%; margin-top: 1rem;">Hide
            Config</button>
        </div>
      </div>

      <div class="main">
        <div class="toolbar">
          <div class="toolbar-left">
            <button id="showConfigBtn" class="toolbar-btn" title="Show Configuration" style="display: none;">
              <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15.9,18.45C17.25,18.45 18.35,17.35 18.35,16C18.35,14.65 17.25,13.55 15.9,13.55C14.54,13.55 13.45,14.65 13.45,16C13.45,17.35 14.54,18.45 15.9,18.45M21.1,16.68L22.58,17.84C22.71,17.95 22.75,18.13 22.66,18.29L21.26,20.71C21.17,20.86 21,20.92 20.83,20.86L19.09,20.16C18.73,20.44 18.33,20.67 17.91,20.85L17.64,22.7C17.62,22.87 17.47,23 17.3,23H14.5C14.32,23 14.18,22.87 14.15,22.7L13.89,20.85C13.46,20.67 13.07,20.44 12.71,20.16L10.96,20.86C10.81,20.92 10.62,20.86 10.54,20.71L9.14,18.29C9.05,18.13 9.09,17.95 9.22,17.84L10.7,16.68L10.65,16L10.7,15.31L9.22,14.16C9.09,14.05 9.05,13.86 9.14,13.71L10.54,11.29C10.62,11.13 10.81,11.07 10.96,11.13L12.71,11.84C13.07,11.56 13.46,11.32 13.89,11.15L14.15,9.29C14.18,9.13 14.32,9 14.5,9H17.3C17.47,9 17.62,9.13 17.64,9.29L17.91,11.15C18.33,11.32 18.73,11.56 19.09,11.84L20.83,11.13C21,11.07 21.17,11.13 21.26,11.29L22.66,13.71C22.75,13.86 22.71,14.05 22.58,14.16L21.1,15.31L21.15,16L21.1,16.68M6.69,8.07C7.56,8.07 8.26,7.37 8.26,6.5C8.26,5.63 7.56,4.92 6.69,4.92A1.58,1.58 0 0,0 5.11,6.5C5.11,7.37 5.82,8.07 6.69,8.07M10.03,6.94L11,7.68C11.07,7.75 11.09,7.87 11.03,7.97L10.13,9.53C10.08,9.63 9.96,9.67 9.86,9.63L8.74,9.18L8,9.62L7.81,10.81C7.79,10.92 7.7,11 7.59,11H5.79C5.67,11 5.58,10.92 5.56,10.81L5.4,9.62L4.64,9.18L3.5,9.63C3.41,9.67 3.3,9.63 3.24,9.53L2.34,7.97C2.28,7.87 2.31,7.75 2.39,7.68L3.34,6.94L3.31,6.5L3.34,6.06L2.39,5.32C2.31,5.25 2.28,5.13 2.34,5.03L3.24,3.47C3.3,3.37 3.41,3.33 3.5,3.37L4.63,3.82L5.4,3.38L5.56,2.19C5.58,2.08 5.67,2 5.79,2H7.59C7.7,2 7.79,2.08 7.81,2.19L8,3.38L8.74,3.82L9.86,3.37C9.96,3.33 10.08,3.37 10.13,3.47L11.03,5.03C11.09,5.13 11.07,5.25 11,5.32L10.03,6.06L10.06,6.5L10.03,6.94Z" />
              </svg>
            </button>
            <button id="selectKeepAllBtn" class="action-btn keep-all-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
              Select keep all
            </button>
            <button id="selectTrashAllBtn" class="action-btn trash-all-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              Select trash all
            </button>
          </div>

          <div id="status" class="status toolbar-status"></div>

          <div class="toolbar-right">
            <button id="trashBtn" class="action-btn trash-btn" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              Trash <span id="trashCount">0</span>
            </button>
            <button id="stackBtn" class="action-btn stack-btn" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
              Stack
            </button>
          </div>
        </div>

        <div id="compareView" class="compare-view">
          <div class="empty-state">Load duplicates to get started</div>
        </div>

        <div class="pagination">
          <button id="prevPairBtn" class="btn-pagination" disabled>Previous</button>
          <span id="pairInfo" class="page-number"></span>
          <button id="nextPairBtn" class="btn-pagination" disabled>Next</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script>navigator.serviceWorker?.register("/sw.js")</script>
  </body>

</html>
